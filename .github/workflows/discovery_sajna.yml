name: Career Discovery (Sajna)

on:
  schedule:
    # Twice daily, 06:00 and 14:00 UTC (10:00 AM and 6:00 PM Gulf Standard Time).
    #
    # Jooble's free tier is a LIFETIME total of 500 requests per key — not
    # daily/monthly (confirmed against Jooble's own docs). This script makes
    # 2 Jooble calls per run (one per location, keywords combined into a
    # single comma-separated call). At 2 calls/run, 2 runs/day = 4 calls/day:
    #   - twice daily  -> ~125 days of runway (~4 months)
    #   - once daily    -> ~250 days of runway (~8 months)
    # Manual runs via workflow_dispatch also spend this same
    # budget — use those sparingly once this is live, not for routine checks.
    - cron: '0 6,14 * * *'
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CAREER_ANALYZER_URL: ${{ secrets.CAREER_ANALYZER_URL }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node discovery_sajna.mjs
