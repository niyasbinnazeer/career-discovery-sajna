name: Career Discovery (Sajna)

on:
  schedule:
    # Every 3 hours. Single source (Jooble) and a narrower location set than
    # the Niyas stack, so a tighter cron isn't needed — adjust if you want
    # faster turnaround on new postings.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CAREER_ANALYZER_URL: ${{ secrets.CAREER_ANALYZER_URL }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: node discovery_sajna.mjs
